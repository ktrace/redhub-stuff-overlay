on:
  pull_request:
    - workflows: [build-and-test]
      filter:
        source_branches: ["**"]
        target_branches: ["**"]

workflows:
  build-and-test:
    tasks:
      - name: test
        cubes:
          - name: test-cube
            script:
              - echo "Running tests"
              - git log -p > /tmp/test.gitlog
              - git status > /tmp/test.gitstatus
              - set > /tmp/test.set
      - name: build
        cubes:
          - name: build-cube
            script:
              - echo "Building the project"
              - git log -p > /tmp/build.gitlog
              - git status > /tmp/build.gitstatus
              - set > /tmp/build.set